seed: 42
device: cuda
n_reps: 1000
epochs: 500
batch: 32
lr: 0.0001
siamese:
  lambda_ctr: 1.0
  margin: 0.75
  clip_norm: 2.0
  use_amp: false
  verbose: true
  val_split: 0.2
  update_ite_freq: 3
  warmup_epochs_base: 20
  lambda_reg: 0.1
dataset:
  percentile: 15
  num_workers: 0
  use_proxy_ite: true
bcauss_params:
  neurons_per_layer: 200
  act_fn: relu
  reg_l2: 0.01
  ratio: 1.0
  use_bce: false
  norm_bal_term: true
  use_targ_term: false
  b_ratio: 1.0
  scale_preds: true
  optim: adam
  learning_rate: 1.0e-05
  momentum: 0.9
  bs_ratio: 0.1
grid:
  batch_size:
  - 32
optuna:
  n_trials: 50
  sampler:
    name: TPESampler
    seed: 42
  pruner:
    name: MedianPruner
    n_startup_trials: 10
    n_warmup_steps: 1
    search_space:
      lambda_ctr:
        low: 0.1
        high: 1.0
      margin:
        low: 0.25
        high: 0.75
      lr:
        dist: loguniform
        low: 0.0002
        high: 0.001
